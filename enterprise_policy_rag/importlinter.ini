# import-linter 配置：静态分层依赖契约（SPEC §2.1）
[importlinter]
root_package = enterprise_policy_rag
include_external_packages = True

# 主干分层（层序自上而下 = 架构从高到低）：
#   composition（装配根，最高）→ interfaces/adapters → application → domain
# 高层可依赖低层，低层禁止反向依赖高层；间接导入链同样受约束。
# interfaces 与 adapters 同级且互相独立（用 | 分隔）。
[importlinter:contract:layered-architecture]
name = Layered architecture
type = layers
layers =
    enterprise_policy_rag.composition
    enterprise_policy_rag.interfaces | enterprise_policy_rag.adapters
    enterprise_policy_rag.application
    enterprise_policy_rag.domain

# domain 纯净：禁止导入任何框架 / 网络 / 数据库库（SPEC §2.1）。
# 外部包必须是根级包名（如 fastapi，而非 fastapi.routing）。
[importlinter:contract:domain-purity]
name = domain is framework-free
type = forbidden
source_modules =
    enterprise_policy_rag.domain
forbidden_modules =
    fastapi
    starlette
    streamlit
    pydantic
    sqlalchemy
    alembic
    faiss
    dashscope
    rank_bm25
    jieba
    httpx
    requests
