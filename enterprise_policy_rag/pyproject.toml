[project]
name = "enterprise-policy-rag"
version = "0.1.0"
description = "企业内部制度知识库问答系统（Phase 1 MVP）：从制度 PDF 检索证据并生成可回看原文、证据不足时拒答的答案。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Enterprise Policy RAG" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "streamlit>=1.33",
    "dashscope>=1.17",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

# 说明：以下依赖在对应 Step 实现时按需引入，Step 0 仅保留骨架声明（避免过早锁定重型依赖）。
# - mineru（PDF 解析适配器，Step 4）
# - ragas（RAGAS 评测，Step 12）
# - opentelemetry-api / opentelemetry-sdk（结构化可观测性，Step 13）

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
    "ruff>=0.4",
    "mypy>=1.9",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_policy_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/enterprise_policy_rag"]

[tool.coverage.run]
source = ["enterprise_policy_rag"]

[tool.coverage.report]
show_missing = true
