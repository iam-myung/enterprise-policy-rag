# Alembic 配置（SPEC §7.3：Alembic 是唯一 Schema 变更入口）

[alembic]
# 迁移脚本目录
script_location = src/enterprise_policy_rag/adapters/persistence/migrations

# 相对路径解析基准
prepend_sys_path = .

# 日志
file_template = %%(rev)s_%%(slug)s

# 连接串由环境变量 DATABASE_URL 注入（env.py 覆盖），此处提供本地默认值。
sqlalchemy.url = sqlite:///workspace/database/enterprise_policy_rag.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
