# import-linter configuration: static layered dependency contract (SPEC 2.1)
[importlinter]
root_package = enterprise_policy_rag
include_external_packages = True

# Core layering (top-to-bottom = high-to-low):
#   composition (root, highest) -> interfaces/adapters -> application -> domain
# Higher layers may depend on lower layers, never the reverse; indirect chains count.
# interfaces and adapters are siblings and independent of each other (separated by |).
[importlinter:contract:layered-architecture]
name = Layered architecture
type = layers
layers =
    enterprise_policy_rag.composition
    enterprise_policy_rag.interfaces | enterprise_policy_rag.adapters
    enterprise_policy_rag.application
    enterprise_policy_rag.domain

# domain purity: forbid importing any framework / network / DB library (SPEC 2.1).
# External packages must be root-level names (e.g. fastapi, not fastapi.routing).
[importlinter:contract:domain-purity]
name = domain is framework-free
type = forbidden
source_modules =
    enterprise_policy_rag.domain
forbidden_modules =
    fastapi
    starlette
    streamlit
    pydantic
    sqlalchemy
    alembic
    faiss
    dashscope
    rank_bm25
    jieba
    httpx
    requests
