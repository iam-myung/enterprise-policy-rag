# Alembic configuration (SPEC 7.3: Alembic is the only schema-change entrypoint)

[alembic]
# migration scripts directory
script_location = src/enterprise_policy_rag/adapters/persistence/migrations

# path resolution base (src layout: lets env.py import enterprise_policy_rag)
prepend_sys_path = src
path_separator = os

# logging
file_template = %%(rev)s_%%(slug)s

# connection string injected via DATABASE_URL env var (env.py override); local default below.
sqlalchemy.url = sqlite:///workspace/database/enterprise_policy_rag.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
